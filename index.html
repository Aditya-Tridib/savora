<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAVORA - Save Smarter, Reach Further</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
  </head>
  <body class="bg-[#080C14] text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // --- PERMANENT OFFICIAL LOGO ASSET ---
      const SAVORA_OFFICIAL_LOGO_SRC = "./photo/logo.png";

      const SavoraOfficialLogo = () => (
        <div className="w-10 h-10 rounded-xl overflow-hidden border border-emerald-500/30 shadow-lg shadow-emerald-500/10 shrink-0 bg-slate-900 flex items-center justify-center">
          <img 
            src={SAVORA_OFFICIAL_LOGO_SRC} 
            alt="SAVORA Official Logo" 
            className="w-full h-full object-cover"
            onError={(e) => {
              e.target.style.display = 'none';
              e.target.parentNode.classList.add('bg-gradient-to-tr', 'from-emerald-600', 'to-teal-400');
              e.target.parentNode.innerHTML = '<span class="text-slate-950 font-black text-sm">S</span>';
            }}
          />
        </div>
      );

      const CURRENCIES = {
        BDT: { name: 'Bangladeshi Taka', symbol: '৳' },
        USD: { name: 'US Dollar', symbol: '$' },
        EUR: { name: 'Euro', symbol: '€' },
        GBP: { name: 'British Pound', symbol: '£' },
        INR: { name: 'Indian Rupee', symbol: '₹' },
      };

      const INITIAL_GOALS = [
        { id: 'g-1', name: 'MacBook Pro M3', targetAmount: 220000, currency: 'BDT', description: 'Upgrading work laptop', emoji: '💻', createdAt: '2026-01-10', archived: false },
        { id: 'g-2', name: 'Japan Vacation', targetAmount: 350000, currency: 'BDT', description: 'Autumn trip to Tokyo', emoji: '✈️', createdAt: '2026-02-01', archived: false },
        { id: 'g-3', name: 'Emergency Fund', targetAmount: 500000, currency: 'BDT', description: '6 months expenses', emoji: '🛡️', createdAt: '2026-01-01', archived: false },
      ];

      const INITIAL_TRANSACTIONS = [
        { id: 't-1', goalId: 'g-1', type: 'deposit', amount: 50000, date: '2026-01-15', note: 'Initial deposit' },
        { id: 't-2', goalId: 'g-2', type: 'deposit', amount: 80000, date: '2026-02-10', note: 'Flight savings' },
      ];

      function App() {
        const [user, setUser] = useState(() => {
          try {
            const savedUser = localStorage.getItem('savora_user');
            return savedUser ? JSON.parse(savedUser) : null;
          } catch (e) {
            return null;
          }
        });

        const [goals, setGoals] = useState(() => {
          try {
            const saved = localStorage.getItem('savora_goals');
            return saved ? JSON.parse(saved) : INITIAL_GOALS;
          } catch (e) {
            return INITIAL_GOALS;
          }
        });

        const [transactions, setTransactions] = useState(() => {
          try {
            const saved = localStorage.getItem('savora_transactions');
            return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
          } catch (e) {
            return INITIAL_TRANSACTIONS;
          }
        });

        useEffect(() => {
          localStorage.setItem('savora_goals', JSON.stringify(goals));
        }, [goals]);

        useEffect(() => {
          localStorage.setItem('savora_transactions', JSON.stringify(transactions));
        }, [transactions]);

        useEffect(() => {
          if (user) {
            localStorage.setItem('savora_user', JSON.stringify(user));
          } else {
            localStorage.removeItem('savora_user');
          }
        }, [user]);

        const [activeTab, setActiveTab] = useState('dashboard');
        const [selectedGoalId, setSelectedGoalId] = useState(null);
        const [currency, setCurrency] = useState('BDT');
        const [searchQuery, setSearchQuery] = useState('');
        const [toast, setToast] = useState(null);

        const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
        const [isEditGoalModalOpen, setIsEditGoalModalOpen] = useState(false);
        const [isDepositModalOpen, setIsDepositModalOpen] = useState(false);
        const [isWithdrawModalOpen, setIsWithdrawModalOpen] = useState(false);
        const [activeModalGoalId, setActiveModalGoalId] = useState(null);
        const [deleteConfirmationGoal, setDeleteConfirmationGoal] = useState(null);
        const [isProfileMenuOpen, setIsProfileMenuOpen] = useState(false);
        const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);

        const showToast = (message, type = 'success') => {
          setToast({ message, type });
          setTimeout(() => setToast(null), 3000);
        };

        const handleGoogleLogin = () => {
          // Simulated secure Google/Gmail OAuth popup flow
          const mockGoogleUser = {
            email: 'saver.user@gmail.com',
            full_name: 'SAVORA Saver',
            avatar_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'
          };
          setUser(mockGoogleUser);
          setIsAuthModalOpen(false);
          setIsProfileMenuOpen(false);
          showToast("Successfully signed in with Google!");
        };

        const handleLogout = () => {
          setUser(null);
          setIsProfileMenuOpen(false);
          showToast("Signed out successfully");
        };

        const handleCreateGoal = (newGoal) => {
          const goalObj = { ...newGoal, id: `g-${Date.now()}`, createdAt: new Date().toISOString().split('T')[0], archived: false };
          setGoals(prev => [goalObj, ...prev]);
          setIsCreateModalOpen(false);
          showToast("Save goal created!");
        };

        const handleAddTransaction = (goalId, type, amount, note, date) => {
          const newTx = { id: `t-${Date.now()}`, goalId, type, amount: Number(amount), note, date: date || new Date().toISOString().split('T')[0] };
          setTransactions(prev => [newTx, ...prev]);
          setIsDepositModalOpen(false);
          setIsWithdrawModalOpen(false);
          showToast(`${type === 'deposit' ? 'Deposit' : 'Withdrawal'} recorded!`);
        };

        const handleConfirmDeleteGoal = () => {
          if (!deleteConfirmationGoal) return;
          const goalId = deleteConfirmationGoal.id;
          setGoals(prev => prev.filter(g => g.id !== goalId));
          setTransactions(prev => prev.filter(t => t.goalId !== goalId));
          if (selectedGoalId === goalId) {
            setSelectedGoalId(null);
            setActiveTab('saves');
          }
          setDeleteConfirmationGoal(null);
          showToast(`Deleted goal`, "error");
        };

        const handleEditGoal = (updatedGoal) => {
          setGoals(prev => prev.map(g => g.id === updatedGoal.id ? updatedGoal : g));
          setIsEditGoalModalOpen(false);
          showToast("Goal updated!");
        };

        const handleDeleteTransaction = (txId) => {
          setTransactions(prev => prev.filter(t => t.id !== txId));
          showToast("Transaction removed!");
        };

        const getGoalStats = (goalId) => {
          const goal = goals.find(g => g.id === goalId);
          if (!goal) return null;
          const goalTxs = transactions.filter(t => t.goalId === goalId);
          const deposits = goalTxs.filter(t => t.type === 'deposit').reduce((sum, t) => sum + Number(t.amount), 0);
          const withdrawals = goalTxs.filter(t => t.type === 'withdrawal').reduce((sum, t) => sum + Number(t.amount), 0);
          const balance = deposits - withdrawals;
          const remaining = Math.max(0, goal.targetAmount - balance);
          const progress = Math.min(100, (balance / goal.targetAmount) * 100);
          const activeDepositDays = new Set(goalTxs.filter(t => t.type === 'deposit').map(t => t.date)).size;
          const avgNetDailySaving = activeDepositDays > 0 ? (deposits - withdrawals) / activeDepositDays : 0;
          return { balance, remaining, progress, deposits, withdrawals, activeDepositDays, avgNetDailySaving };
        };

        const totalOverview = useMemo(() => ({
          totalBalance: goals.reduce((acc, g) => acc + (getGoalStats(g.id)?.balance || 0), 0),
          totalTarget: goals.reduce((acc, g) => acc + g.targetAmount, 0),
          totalDeposits: transactions.filter(t => t.type === 'deposit').reduce((acc, t) => acc + t.amount, 0),
          totalWithdrawals: transactions.filter(t => t.type === 'withdrawal').reduce((acc, t) => acc + t.amount, 0),
        }), [goals, transactions]);

        const selectedGoal = goals.find(g => g.id === selectedGoalId);

        return (
          <div className="min-h-screen bg-[#080C14] text-slate-100 flex flex-col font-sans antialiased">
            {toast && (
              <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl font-bold text-xs shadow-2xl flex items-center gap-2 border bg-emerald-950/90 text-emerald-200 border-emerald-800 animate-bounce">
                <span>{toast.message}</span>
              </div>
            )}

            <header className="bg-slate-900/60 border-b border-slate-800/85 backdrop-blur-md sticky top-0 z-40 px-4 lg:px-8 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <SavoraOfficialLogo />
                <div>
                  <h1 className="font-black text-base tracking-tight text-slate-100">SAVORA</h1>
                  <p className="text-[10px] text-slate-400 font-medium">Save smarter. Reach further.</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button onClick={() => setIsCreateModalOpen(true)} className="px-3.5 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-1.5 transition-all">
                  <span>+ New Save</span>
                </button>

                <div className="relative">
                  <button 
                    onClick={() => setIsProfileMenuOpen(!isProfileMenuOpen)}
                    className="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/80 flex items-center justify-center overflow-hidden hover:border-emerald-500 transition-colors"
                  >
                    {user?.avatar_url ? (
                      <img src={user.avatar_url} alt="Profile" className="w-full h-full object-cover" />
                    ) : (
                      <span className="font-bold text-xs text-slate-300">{user?.email ? user.email.charAt(0).toUpperCase() : '👤'}</span>
                    )}
                  </button>

                  {isProfileMenuOpen && (
                    <div className="absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-2 z-50 text-xs space-y-1">
                      <div className="p-2 border-b border-slate-800">
                        <p className="font-bold text-slate-200 truncate">{user?.full_name || 'Guest Saver'}</p>
                        <p className="text-[10px] text-slate-400 truncate">{user?.email || 'Not signed in'}</p>
                      </div>
                      {user ? (
                        <button onClick={handleLogout} className="w-full text-left p-2 text-rose-400 hover:bg-slate-800 rounded-xl font-bold transition-colors">Log Out</button>
                      ) : (
                        <button onClick={() => { setIsProfileMenuOpen(false); setIsAuthModalOpen(true); }} className="w-full text-left p-2 text-emerald-400 hover:bg-slate-800 rounded-xl font-bold transition-colors">Sign In with Google</button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </header>

            <div className="flex-1 flex max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 gap-8">
              <aside className="hidden lg:block w-56 shrink-0 space-y-2">
                {[
                  { id: 'dashboard', label: 'Dashboard' },
                  { id: 'saves', label: 'My Saves' },
                  { id: 'transactions', label: 'History' },
                  { id: 'statistics', label: 'Analytics' },
                  { id: 'settings', label: 'Settings' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => { setSelectedGoalId(null); setActiveTab(tab.id); }}
                    className={`w-full text-left px-4 py-3 rounded-xl font-bold text-xs transition-all ${
                      activeTab === tab.id && !selectedGoalId ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </aside>

              <main className="flex-1 min-w-0">
                {selectedGoal ? (
                  <div className="space-y-6">
                    <button onClick={() => setSelectedGoalId(null)} className="text-xs font-bold text-slate-400 hover:text-slate-100">← Back to Saves</button>
                    <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 space-y-6">
                      <div className="flex justify-between items-center">
                        <div className="flex items-center gap-4">
                          <div className="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center text-3xl">{selectedGoal.emoji}</div>
                          <div>
                            <h2 className="text-2xl font-black text-slate-100">{selectedGoal.name}</h2>
                            <p className="text-xs text-slate-400">{selectedGoal.description}</p>
                          </div>
                        </div>
                        <div className="flex gap-3">
                          <button onClick={() => { setActiveModalGoalId(selectedGoal.id); setIsDepositModalOpen(true); }} className="px-5 py-2.5 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Deposit</button>
                          <button onClick={() => { setActiveModalGoalId(selectedGoal.id); setIsWithdrawModalOpen(true); }} className="px-5 py-2.5 bg-slate-800 text-slate-200 font-bold rounded-xl text-xs">Withdraw</button>
                        </div>
                      </div>
                    </div>
                  </div>
                ) : (
                  <>
                    {activeTab === 'dashboard' && (
                      <div className="space-y-6">
                        <div className="bg-slate-900/60 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
                          <div>
                            <h2 className="text-xl font-black text-slate-100">Welcome Back, {user ? user.full_name.split(' ')[0] : 'Saver'}! 👋</h2>
                            <p className="text-xs text-slate-400 mt-1">Track your total savings and reach milestones faster.</p>
                          </div>
                          <button onClick={() => setIsCreateModalOpen(true)} className="px-4 py-2.5 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">+ Create Save</button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                            <span className="text-[10px] text-slate-400 block">Total Saved</span>
                            <span className="font-black text-xl text-emerald-400">৳{totalOverview.totalBalance.toLocaleString()}</span>
                          </div>
                          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                            <span className="text-[10px] text-slate-400 block">Total Target</span>
                            <span className="font-black text-xl text-slate-100">৳{totalOverview.totalTarget.toLocaleString()}</span>
                          </div>
                          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                            <span className="text-[10px] text-slate-400 block">Total Deposits</span>
                            <span className="font-black text-xl text-blue-400">৳{totalOverview.totalDeposits.toLocaleString()}</span>
                          </div>
                        </div>

                        <div>
                          <h3 className="font-bold text-sm text-slate-200 mb-4">Active Goals</h3>
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {goals.filter(g => !g.archived).map(goal => {
                              const stats = getGoalStats(goal.id);
                              return (
                                <div key={goal.id} onClick={() => setSelectedGoalId(goal.id)} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 hover:border-emerald-500/50 transition-all cursor-pointer space-y-4">
                                  <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-xl">{goal.emoji}</div>
                                    <div>
                                      <h4 className="font-bold text-sm text-slate-100">{goal.name}</h4>
                                      <p className="text-[10px] text-slate-400">{goal.description}</p>
                                    </div>
                                  </div>
                                  <div>
                                    <div className="flex justify-between items-end mb-1.5 text-xs">
                                      <span className="text-slate-400">Balance</span>
                                      <span className="font-black text-slate-100">৳{stats?.balance?.toLocaleString()}</span>
                                    </div>
                                    <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                                      <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${stats?.progress || 0}%` }} />
                                    </div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}
                    {activeTab === 'saves' && (
                      <div className="space-y-6">
                        <h2 className="text-xl font-bold text-slate-100">My Saves</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                          {goals.map(goal => (
                            <div key={goal.id} onClick={() => setSelectedGoalId(goal.id)} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 cursor-pointer">
                              <h4 className="font-bold text-sm text-slate-100">{goal.emoji} {goal.name}</h4>
                              <p className="text-xs text-slate-400 mt-1">Target: ৳{goal.targetAmount}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {activeTab === 'transactions' && (
                      <div className="space-y-6">
                        <h2 className="text-xl font-bold text-slate-100">Transaction History</h2>
                        <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 space-y-2">
                          {transactions.map(tx => (
                            <div key={tx.id} className="flex justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                              <div>
                                <p className="font-bold text-slate-200">{tx.note || tx.type}</p>
                                <p className="text-[10px] text-slate-500">{tx.date}</p>
                              </div>
                              <span className={tx.type === 'deposit' ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>৳{tx.amount}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {activeTab === 'statistics' && <div className="text-slate-400 text-sm">Analytics overview active.</div>}
                    {activeTab === 'settings' && <div className="text-slate-400 text-sm">Settings panel active.</div>}
                  </>
                )}
              </main>
            </div>

            {isCreateModalOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4">
                  <h3 className="font-bold text-base text-slate-100">Create New Goal</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    handleCreateGoal({
                      name: formData.get('name'),
                      targetAmount: Number(formData.get('targetAmount')),
                      emoji: formData.get('emoji') || '🎯',
                      description: formData.get('description') || ''
                    });
                  }} className="space-y-3 text-xs">
                    <input name="name" type="text" required placeholder="Goal Name" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100" />
                    <input name="targetAmount" type="number" required placeholder="Target Amount" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100" />
                    <input name="emoji" type="text" placeholder="Emoji (e.g. 💻)" defaultValue="💻" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100" />
                    <input name="description" type="text" placeholder="Description" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100" />
                    <div className="flex gap-3 pt-2">
                      <button type="button" onClick={() => setIsCreateModalOpen(false)} className="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold">Cancel</button>
                      <button type="submit" className="flex-1 py-2.5 bg-emerald-500 text-slate-950 rounded-xl font-bold">Create</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {isAuthModalOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 text-center space-y-4">
                  <h3 className="font-bold text-base text-slate-100">Sign In to SAVORA</h3>
                  <p className="text-xs text-slate-400">Connect your Google account to sync your goals and save securely.</p>
                  <button onClick={handleGoogleLogin} className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs flex items-center justify-center gap-2">
                    <span>Continue with Google / Gmail</span>
                  </button>
                  <button onClick={() => setIsAuthModalOpen(false)} className="w-full py-2 bg-slate-800 text-slate-400 font-bold rounded-xl text-xs">Cancel</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
